<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DAYDREAMERS — Login</title>

    <meta
        name="description"
        content="DAYDREAMERS — Study • Progress • Grow Together"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(108, 99, 255, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(236, 72, 153, 0.18),
                    transparent 35%
                ),
                #0b1020;

            color: #ffffff;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .brand p {
            margin-top: 6px;
            color: #aeb7d0;
            font-size: 14px;
        }

        .login-card {
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;

            background: rgba(20, 27, 48, 0.88);
            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .welcome {
            text-align: center;
            margin-bottom: 26px;
        }

        .welcome-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .welcome h2 {
            font-size: 23px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #9da8c2;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #dce3f5;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.055);
            color: #ffffff;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #6f7a94;
        }

        input:focus {
            border-color: #7c6cff;
            box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.14);
        }

        .login-button {
            width: 100%;
            margin-top: 6px;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #7065ff,
                #8b5cf6
            );

            color: #ffffff;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            opacity: 0.94;
        }

        .login-button:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: #68738d;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .create-account {
            text-align: center;
            color: #9da8c2;
            font-size: 14px;
        }

        .create-account a {
            color: #a99fff;
            font-weight: 700;
            text-decoration: none;
        }

        .create-account a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            margin-top: 20px;

            text-align: center;

            color: #7f8aa5;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #ffffff;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
        .forgot-password {
    text-align: right;
    margin-top: 8px;
}

.forgot-password button {
    background: none;
    border: none;
    padding: 0;
    color: #9b8cff;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
}

.forgot-password button:hover {
    opacity: 0.75;
    text-decoration: underline;
}

.forgot-password button:disabled {
    opacity: 0.6;
    cursor: wait;
}
    </style>
</head>

<body>

    <main class="login-container">

        <div class="brand">
            <h1>DAYDREAMERS</h1>
            <p>Study • Progress • Grow Together</p>
        </div>

        <section class="login-card">

            <div class="welcome">
                <div class="welcome-icon">🔐</div>

                <h2>Welcome Back</h2>

                <p>
                    Sign in to continue your CA journey.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

               <input
    type="password"
    id="password"
    name="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
>
<div class="forgot-password">
    <button type="button" id="forgotPasswordBtn">
        Forgot password?
    </button>
</div>  
        
                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

            <div class="divider">
                OR
            </div>

            <div class="create-account">
                Don't have an account?
                <a href="#" id="createAccountLink">
                    Create account
                </a>
            </div>

        </section>

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to DAYDREAMERS
        </a>

    </main>
<script type="module">
    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCz_qv-BDYFq6demMx2EZU3t1dgaRKvrr8",
        authDomain: "daydreamers-db417.firebaseapp.com",
        projectId: "daydreamers-db417",
        storageBucket: "daydreamers-db417.firebasestorage.app",
        messagingSenderId: "570906387646",
       appId: "1:570906387646:web:3a6285307144c1dc8b2aef",
measurementId: "G-LCGSS1Q36F"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const loginForm = document.getElementById("loginForm");
    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");

forgotPasswordBtn.addEventListener("click", async function () {

    const email = document.getElementById("email").value.trim();

    if (!email) {
        alert("Please enter your email address first.");
        document.getElementById("email").focus();
        return;
    }

    forgotPasswordBtn.disabled = true;
    forgotPasswordBtn.textContent = "Sending...";

    try {

        await sendPasswordResetEmail(auth, email);

        alert(
            "Password reset email sent!\n\n" +
            "Please check your inbox and follow the instructions."
        );

    } catch (error) {

        console.error("Password reset error:", error);

        alert(
            "Could not send the password reset email.\n\n" +
            "Please check the email address and try again."
        );

    } finally {

        forgotPasswordBtn.disabled = false;
        forgotPasswordBtn.textContent = "Forgot password?";

    }

});


    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;


        const button = loginForm.querySelector(".login-button");

        button.disabled = true;
        button.textContent = "Signing in...";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            window.location.href = "index.html";

        } catch (error) {

            console.error("Login error:", error);

            alert(
                "Login failed.\n\n" +
                "Please check your email and password."
            );

            button.disabled = false;
            button.textContent = "Login";
        }

    });
</script>
</body>
</html>
